<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
<style>
  @page { size: 148mm 105mm; margin: 0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html{height:104.6mm;overflow:hidden} body { width:148mm; height:104.6mm; overflow:hidden; page-break-after:avoid; page-break-inside:avoid;
         font-family:"Inter",sans-serif; color:#F6F1EA;
         background:linear-gradient(150deg,#141017 0%, #2A1F38 55%, #4A3570 100%);
         display:flex; align-items:center; }
  .left { flex:1.25; padding:14mm 8mm 14mm 14mm; }
  .over { font-size:7.5pt; letter-spacing:.32em; text-transform:uppercase; color:#C9A86A; margin-bottom:6mm; }
  h1 { font-family:"Cormorant Garamond",serif; font-style:italic; font-weight:500;
       font-size:30pt; line-height:1.1; color:#F6F1EA; margin-bottom:5mm; }
  .sub { font-family:"Cormorant Garamond",serif; font-style:italic; font-size:12.5pt; color:#C9B6E4; margin-bottom:8mm; }
  .cta { font-size:10.5pt; font-family:"Cormorant Garamond",serif; font-style:italic; font-weight:300; color:rgba(246,241,234,.75); line-height:1.6; max-width:62mm; }
  .right { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-right:12mm; }
  .qr-frame { background:#F6F1EA; padding:5mm; border-radius:4mm;
              box-shadow:0 6px 30px rgba(0,0,0,.45); }
  .qr-frame img { display:block; width:38mm; height:38mm; }
  .qr-label { margin-top:4mm; font-size:6.5pt; letter-spacing:.22em; text-transform:uppercase; color:#C9B6E4; }
</style>
</head>
<body>
  <div class="left">
    <p class="over">7 &amp; 8 novembre 2026 · Paris</p>
    <h1>Joyeux anniversaire, Elé</h1>
    <p class="sub">25 ans — un week-end rien que pour toi.</p>
    <p class="cta">Scanne-moi. J'ai des choses à te montrer. 💜</p>
  </div>
  <div class="right">
    <div class="qr-frame"><img src="assets/qr.png" alt="QR code vers le site" /></div>
    <p class="qr-label">Pour Elé</p>
  </div>
</body>
</html>
